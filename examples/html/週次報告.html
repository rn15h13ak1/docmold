/* 共通スタイル。色・字送りはすべて CSS 変数（テーマ）から取り、ここには直値を置かない。 */

/* --- ヘッダ / フッタ ------------------------------------------------------ */

}

/* --- 本文 ---------------------------------------------------------------- */

.dm-content h1, .dm-content h2, .dm-content h3,
.dm-content h4, .dm-content h5, .dm-content h6 {

}
.dm-content > .dm-section:first-child > :first-child,
.dm-content > :first-child { margin-top: 0; }

.dm-content h1 { font-size: 21px; border-bottom: 2px solid var(--accent); padding-bottom: 6px; }
.dm-content h2 { font-size: 18px; border-left: 5px solid var(--accent); padding-left: 10px; }
.dm-content h3 { font-size: 16px; color: var(--accent); }
.dm-content h4, .dm-content h5, .dm-content h6 { font-size: 15px; }

.dm-heading__number { color: var(--muted); margin-right: 0.6em; font-variant-numeric: tabular-nums; }

.dm-content p { margin: 0.8em 0; }

.dm-content blockquote {

/* --- 表 ------------------------------------------------------------------ */

.dm-content table, .dm-table {
  border-collapse: collapse;
  width: 100%;
  margin: 1em 0;
  font-size: 14px;
}
/* 列の幅は内容量に応じて配分する。最後の列を特別扱いすると、最後より前の列にも
   文章が入る表で最後の列が潰れ、1 文字ずつ縦に積まれてしまうため。
   見出しだけ折り返さずに済む幅を保ち、ラベルが「項／目」と割れるのを防ぐ。
   min-width は、どの列も 1 文字ずつ縦積みにならないための下限。 */
.dm-content table:not(.dm-meta) th:not(:last-child),
.dm-table:not(.dm-meta) th:not(:last-child) { white-space: nowrap; }
.dm-content table:not(.dm-meta) th,
.dm-content table:not(.dm-meta) td,
.dm-table:not(.dm-meta) th,
.dm-table:not(.dm-meta) td { min-width: 4.5em; }
/* セルの中は、収まらない語をどこででも折り返させる。識別子やシグネチャ、
   スラッシュでつないだ並び（read/write/accept/…）は空白も約物も無いため既定では
   改行できず、列がその長さの幅を要求して表が枠からはみ出す。anywhere は語が
   収まらないときだけ効き、列の下限（min-width）も一緒に下がる。表の外には
   効かせない（本文中の語まで不自然な位置で割れるため）。 */
.dm-content table:not(.dm-meta) th,
.dm-content table:not(.dm-meta) td,
.dm-table:not(.dm-meta) th,
.dm-table:not(.dm-meta) td { overflow-wrap: anywhere; }
.dm-content th, .dm-content td, .dm-table th, .dm-table td {
  border: 1px solid var(--border);
  padding: 6px 10px;
  text-align: left;
  vertical-align: top;
}
.dm-content thead th, .dm-table thead th { background: var(--accent-weak); color: var(--text); }
.dm-content caption, .dm-table__caption {
  caption-side: top;
  text-align: left;
  padding: 0 0 6px;
  color: var(--muted);
  font-size: 13px;
}

/* セルの中の箇条書き。行が間延びしないよう、余白を詰める。 */
.dm-content td > ul, .dm-content td > ol,
.dm-table td > ul, .dm-table td > ol { margin: 0; padding-left: 1.2em; }
.dm-content td > :first-child, .dm-table td > :first-child { margin-top: 0; }
.dm-content td > :last-child, .dm-table td > :last-child { margin-bottom: 0; }

.dm-meta { width: auto; min-width: 60%; margin: 0 0 24px; font-size: 14px; }
.dm-meta th {
  background: var(--surface);
  color: var(--muted);
  white-space: nowrap;

}

/* --- コード -------------------------------------------------------------- */

.dm-content code, .dm-content pre { font-family: var(--mono); font-size: 13px; }
.dm-content :not(pre) > code {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 5px;
}
.dm-content pre {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 12px 14px;

}
.dm-content pre code { background: none; border: 0; padding: 0; }

.dm-code { position: relative; }
.dm-code__copy {

  right: 8px;
  font-family: var(--font);
  font-size: 12px;

  background: var(--background);
  border: 1px solid var(--border);
  border-radius: 3px;
  cursor: pointer;
}
.dm-code__copy:hover { background: var(--accent-weak); }

/* --- 目次 ---------------------------------------------------------------- */

.dm-toc {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 14px 20px;
  margin: 0 0 28px;
}
.dm-toc__title { margin: 0 0 8px; font-weight: bold; color: var(--accent); font-size: 14px; }
.dm-toc__list { list-style: none; margin: 0; padding: 0; font-size: 14px; }
.dm-toc__item { line-height: 1.8; }
.dm-toc__item a { color: var(--text); text-decoration: none; }
.dm-toc__item a:hover { color: var(--accent); text-decoration: underline; }
.dm-toc__item--h2 { padding-left: 1.2em; }
.dm-toc__item--h3 { padding-left: 2.4em; font-size: 13px; }
.dm-toc__item--h4 { padding-left: 3.6em; font-size: 13px; }
.dm-toc__item--h5, .dm-toc__item--h6 { padding-left: 4.8em; font-size: 13px; }
.dm-toc__number { color: var(--muted); margin-right: 0.6em; font-variant-numeric: tabular-nums; }

/* --- バッジ -------------------------------------------------------------- */

.dm-badge {
  display: inline-block;
  padding: 1px 9px;
  border-radius: 10px;
  font-size: 12px;
  line-height: 1.7;
  white-space: nowrap;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
}
.dm-badge--ok      { background: #e8f5ec; border-color: var(--ok);     color: var(--ok); }
.dm-badge--warn    { background: #fdf3e0; border-color: var(--warn);   color: var(--warn); }
.dm-badge--danger  { background: #fdecea; border-color: var(--danger); color: var(--danger); }
.dm-badge--info    { background: #eaf1fa; border-color: var(--info);   color: var(--info); }
.dm-badge--person  { background: var(--accent-weak); border-color: var(--accent); color: var(--accent); }

/* --- コールアウト -------------------------------------------------------- */

.dm-callout {
  border: 1px solid var(--border);
  border-left: 5px solid var(--accent);
  background: var(--surface);
  border-radius: 3px;
  padding: 12px 18px;
  margin: 1em 0;
}
.dm-callout > :first-child { margin-top: 0; }
.dm-callout > :last-child { margin-bottom: 0; }
.dm-callout__title { font-weight: bold; color: var(--accent); margin: 0 0 6px; }
.dm-callout--decision { border-left-color: var(--accent); background: var(--accent-weak); }
.dm-callout--rollback { border-left-color: var(--danger); background: #fdecea; }
.dm-callout--rollback .dm-callout__title { color: var(--danger); }
/* 引用の記法で書くコールアウト（callout_blockquote）の系統。背景は本文と同じ
   surface のままにし、左の縁とタイトルの色だけで種別を示す。1 ページに何十個も
   並ぶため、色面が増えると本文より枠のほうが目立ってしまう。 */
.dm-callout--ok     { border-left-color: var(--ok); }
.dm-callout--warn   { border-left-color: var(--warn); }
.dm-callout--danger { border-left-color: var(--danger); }
.dm-callout--ok .dm-callout__title     { color: var(--ok); }
.dm-callout--warn .dm-callout__title   { color: var(--warn); }
.dm-callout--danger .dm-callout__title { color: var(--danger); }
/* 折りたたみ（[!note]- / +）。つまみは見出しと同じ体裁のまま、開閉できると分かる形にする。 */
details.dm-callout > .dm-callout__title { cursor: pointer; margin: 0; }
details.dm-callout[open] > .dm-callout__title { margin-bottom: 6px; }

/* python-markdown の admonition (!!! note / warning / danger) */
.admonition {
  border: 1px solid var(--border);
  border-left: 5px solid var(--accent);
  background: var(--surface);
  border-radius: 3px;
  padding: 12px 18px;
  margin: 1em 0;
}
.admonition > :first-child { margin-top: 0; }
.admonition > :last-child { margin-bottom: 0; }
.admonition-title { font-weight: bold; color: var(--accent); margin: 0 0 6px; }
.admonition.warning, .admonition.caution { border-left-color: var(--warn); }
.admonition.warning .admonition-title, .admonition.caution .admonition-title { color: var(--warn); }
.admonition.danger, .admonition.error { border-left-color: var(--danger); background: #fdecea; }
.admonition.danger .admonition-title, .admonition.error .admonition-title { color: var(--danger); }

/* --- チェックリスト ------------------------------------------------------ */

.dm-checklist { list-style: none; padding-left: 0; }
.dm-checklist__item { margin: 0.35em 0; }
.dm-checklist__item--done { color: var(--muted); text-decoration: line-through; }
/* 担当者バッジまで打ち消し線が掛かると読みにくいため、バッジは対象外にする。 */
.dm-checklist__item--done .dm-badge { text-decoration: none; }
.dm-check { margin-right: 8px; vertical-align: middle; }

.dm-attendees { list-style: none; padding-left: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.dm-attendee {
  background: var(--accent-weak);
  border: 1px solid var(--accent);
  color: var(--accent);
  border-radius: 10px;
  padding: 1px 12px;
  font-size: 13px;
}

/* --- 手順カード ---------------------------------------------------------- */

.dm-step {
  border: 1px solid var(--border);
  border-radius: 4px;
  margin: 20px 0;
  padding: 0 20px 8px;
  background: var(--background);
}
.dm-step__title {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 -20px 12px;
  padding: 10px 20px;
  background: var(--accent-weak);
  border: 0;
  border-bottom: 1px solid var(--border);
  border-radius: 4px 4px 0 0;
  font-size: 16px;
}
.dm-step__number {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-text);
  font-size: 14px;
}
.dm-step__check {
  margin-left: auto;
  font-size: 12px;
  font-weight: normal;
  color: var(--muted);
  white-space: nowrap;
  cursor: pointer;
}

/* --- サマリカード / ダッシュボード --------------------------------------- */

.dm-summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin: 0 0 28px;
}
.dm-summary__card {
  border: 1px solid var(--border);
  border-top: 4px solid var(--accent);
  border-radius: 4px;
  background: var(--surface);
  padding: 12px 16px;
}
.dm-summary__card--ok     { border-top-color: var(--ok); }
.dm-summary__card--warn   { border-top-color: var(--warn); }
.dm-summary__card--danger { border-top-color: var(--danger); }
.dm-summary__label { margin: 0 0 4px; font-size: 12px; color: var(--muted); }
.dm-summary__value { margin: 0; font-size: 16px; font-weight: bold; line-height: 1.5; }

.dm-content--dashboard,
.dm-content--columns {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
  gap: 16px;
  align-items: start;
}
.dm-content--dashboard > .dm-section,
.dm-content--columns > .dm-section {
  border: 1px solid var(--border);
  border-top: 4px solid var(--accent);
  border-radius: 4px;
  background: var(--surface);
  padding: 4px 18px 14px;
  margin: 0;
}
.dm-content--dashboard > .dm-section > :first-child,
.dm-content--columns > .dm-section > :first-child { margin-top: 14px; }
/* カード幅が狭いと表の列が 1 文字ずつ折り返されるため、下限を与えて
   収まらない分はカード内で横スクロールさせる。 */
.dm-content--dashboard > .dm-section,
.dm-content--columns > .dm-section { overflow-x: auto; }
.dm-content--dashboard table { min-width: 24em; }
/* 列並べは 1 列が狭いため、表の下限は置かず列の幅に従わせる。 */
.dm-content--dashboard h1, .dm-content--dashboard h2,
.dm-content--columns h1, .dm-content--columns h2 {
  border: 0;
  padding: 0;
  font-size: 16px;
  color: var(--accent);
}

/* --- 列並べ -------------------------------------------------------------- */

/* 節を横に並べる種類。紙面を広げ、1 列あたりの下限を小さめに取ることで、
   節が 3 つなら 3 列に並ぶようにしている。幅が足りなければ自動で折り返す。 */
.dm-page--wide { max-width: 1280px; }
.dm-content--columns { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.dm-content--columns > .dm-section { padding: 4px 14px 12px; }
.dm-content--columns h3 { font-size: 14px; margin: 18px 0 6px; border: 0; padding: 0; }

/* 小見出しでまとめ直した並び (group_columns)。
   ひとまとまりを全幅に広げ、その中で節を列にする。 */
.dm-content--columns > .dm-groups { grid-column: 1 / -1; }
/* 小見出しを持たない節（トピックスなど）は列に割り付けず、横幅いっぱいに置く。
   中身が枠を持つため、節そのものはカードにしない。 */
.dm-content--columns > .dm-section--full {
  grid-column: 1 / -1;
  border: 0;
  background: transparent;
  padding: 0;
  overflow: visible;
}
.dm-group { margin: 0 0 22px; }
/* まとまりの見出しは帯にする。どこからどの見出しの内容かを、
   枠線ではなく面で示すため。 */
.dm-content--columns .dm-group__title {
  margin: 0 0 10px;
  padding: 5px 12px;
  font-size: 15px;
  color: var(--accent-text);
  background: var(--accent);
  border: 0;
  border-radius: 3px;
}

/* 1 列の節 (トピックス) の見出しは帯にしない。中の枠が濃い帯を持つため、
   帯を重ねると段の上下が読み取れなくなる。 */
.dm-content--columns > .dm-section--full > h2 {
  margin: 0 0 12px;
  padding: 0 0 6px;
  font-size: 18px;
  color: var(--accent);
  background: transparent;
  border: 0;
  border-bottom: 2px solid var(--accent);
  border-radius: 0;
}
.dm-group__columns {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 12px;
  align-items: start;
}
.dm-column {
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface);
  padding: 8px 12px 10px;
  overflow-x: auto;
}
.dm-column > :last-child { margin-bottom: 0; }
/* 列の見出しは、まとまりの帯より一段弱い帯にする（入れ子が読み取れるように）。 */
.dm-column__title {
  margin: -8px -12px 8px;
  padding: 4px 12px;
  font-size: 13px;
  font-weight: bold;
  color: var(--accent);
  background: var(--accent-weak);
  border-bottom: 1px solid var(--border);
  border-radius: 3px 3px 0 0;
}
.dm-column > :last-child { margin-bottom: 0; }

/* サブ項目 (見出し 4) のまとまり。まとまりの帯より一段弱い帯にする。 */
.dm-subgroup { margin: 0 0 10px; }
.dm-subgroup:last-child { margin-bottom: 0; }
.dm-content--columns .dm-subgroup__title {
  margin: 0 0 6px;
  padding: 3px 10px;
  font-size: 13px;
  color: var(--accent);
  background: var(--accent-weak);
  border: 0;
  border-left: 4px solid var(--accent);
  border-radius: 0 3px 3px 0;
}

/* サブ項目は淡い帯。左端は本文とそろえる（帯の内側に字下げを作らない）。 */
.dm-content--columns .dm-topic h4 {
  margin: 14px -14px 6px;
  padding: 3px 14px;
  font-size: 13px;
  color: var(--accent);
  background: var(--accent-weak);
  border: 0;
}

/* さらに深い見出し。帯は持たせず、色だけで見出しだと示す（既定の大きさのままだと、
   浅い見出しより大きく見えて段が逆転する）。 */
.dm-content--columns .dm-topic h5, .dm-content--columns .dm-topic h6,
.dm-content--columns .dm-column h5, .dm-content--columns .dm-column h6 {
  margin: 12px 0 4px;
  padding: 0;
  font-size: 13px;
  color: var(--accent);
  border: 0;
}
.dm-column--empty { background: transparent; border-style: dashed; }
.dm-column__empty { margin: 0; color: var(--muted); }

/* 件数の並び (count_summary)。 */
.dm-counts { list-style: none; display: flex; flex-wrap: wrap; gap: 4px 6px; margin: 6px 0 10px; padding: 0; }
.dm-count {
  display: inline-flex;
  align-items: baseline;
  gap: 4px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--background);
  padding: 0 7px;
  font-size: 12px;
  line-height: 1.9;
}
.dm-count__label { color: var(--muted); }
.dm-count__value { font-family: var(--mono); font-weight: bold; color: var(--accent); }

/* 列は幅が限られるため、箇条書きの字下げを詰める。ブラウザ既定の 40px だと
   折り返しが増えて読みにくくなる。 */
.dm-content--columns ul { padding-left: 1.3em; }
.dm-content--columns ol { padding-left: 1.7em; }
.dm-content--columns li { margin: 2px 0; }

/* 項目ごとに枠を分ける (topic_cards)。 */
/* 枠への目次。トピックの枠と同じ体裁にそろえる（下の .dm-topic と同じ指定）。 */
.dm-topic-index { margin: 0 0 10px; }
/* 行頭に通し番号が付くため、中点は置かない。字下げも戻す
   （.dm-content--columns ul の指定より強くする必要がある）。 */
.dm-content--columns .dm-topic-index__list {
  list-style: none;
  margin: 0;
  padding-left: 0;
  font-size: 13px;
}
.dm-topic-index__list li { margin: 2px 0; }
.dm-topic-index__list a { color: var(--accent); text-decoration: none; }
.dm-topic-index__list a:hover { text-decoration: underline; }

.dm-topics {
  /* 枠は縦に積む。横に並べると、行数の違う枠が凸凹に見えるため。 */
  display: grid;
  gap: 10px;
  margin: 8px 0 0;
}
.dm-topic, .dm-topic-index {
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--background);
  padding: 0 14px 10px;
  overflow: hidden;
}
/* 枠の見出しは濃い帯。段が下がるほど帯を淡くして、上下関係を色の濃さで示す。 */
.dm-content--columns .dm-topic > h3,
.dm-content--columns .dm-topic-index__title {
  margin: 0 -14px 10px;
  padding: 5px 14px;
  font-size: 14px;
  color: var(--accent-text);
  background: var(--accent);
  border: 0;
}
/* 通し番号。見出しの文言と地続きに見えないよう、少し離して弱く見せる。 */
.dm-topic__number { margin-right: 2px; opacity: 0.85; font-variant-numeric: tabular-nums; }

.dm-topic > :first-child, .dm-topic-index > :first-child { margin-top: 0; }
.dm-topic > :last-child, .dm-topic-index > :last-child { margin-bottom: 0; }
/* 見出しを書かない枠は、上に余白を戻す。 */
.dm-topic > :first-child:not(h3) { margin-top: 10px; }

/* 1 行 1 件のカード (entry_card)。 */
.dm-entries { list-style: none; margin: 0 0 10px; padding: 0; }
.dm-entry {
  /* 普通の項目と混ざった箇条書きでも、カードには行頭記号を出さない。 */
  list-style: none;
  border-left: 3px solid var(--accent);
  background: var(--background);
  padding: 5px 10px;
  margin: 0 0 6px;
}
.dm-entry__head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; margin: 0; line-height: 1.6; }
.dm-entry__key { font-family: var(--mono); font-weight: bold; color: var(--accent); }
.dm-entry__meta { color: var(--muted); font-size: 12px; }
.dm-entry__body { margin: 2px 0 0; font-size: 14px; line-height: 1.6; }
/* 1 件に添えるコメント。本文と区別が付くよう、区切り線と弱い色で下段に置く。 */
.dm-entry__note {
  margin: 6px 0 0;
  padding-top: 5px;
  border-top: 1px dashed var(--border);
  color: var(--muted);
  font-size: 12.5px;
  line-height: 1.7;
}
.dm-entry__note > :first-child { margin-top: 0; }
.dm-entry__note > :last-child { margin-bottom: 0; }
.dm-entry__note ul, .dm-entry__note ol { margin: 0; padding-left: 1.3em; }

/* --- タイムライン -------------------------------------------------------- */

.dm-timeline { list-style: none; margin: 1em 0; padding: 0 0 0 8px; border-left: 2px solid var(--border); }
.dm-timeline__item { position: relative; padding: 0 0 14px 22px; }
.dm-timeline__item::before {
  content: "";
  position: absolute;
  left: -7px;
  top: 9px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--background);
}
.dm-timeline__time {
  display: block;
  font-family: var(--mono);
  font-size: 13px;
  color: var(--accent);
  font-weight: bold;
}
.dm-timeline__body p { margin: 2px 0; }

/* --- 進捗バー ------------------------------------------------------------ */

.dm-progress { display: flex; align-items: center; gap: 8px; }
.dm-progress__track {
  flex: 1;
  min-width: 60px;
  height: 8px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
}
.dm-progress__fill { display: block; height: 100%; background: var(--accent); }
.dm-progress__label { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* --- 図表 ---------------------------------------------------------------- */

.dm-figure { margin: 1.5em 0; text-align: center; }
.dm-figure img { max-width: 100%; height: auto; border: 1px solid var(--border); }
.dm-figure__caption { margin-top: 6px; font-size: 13px; color: var(--muted); }
.dm-xref { text-decoration: none; border-bottom: 1px dotted var(--accent); }

.dm-figure-index {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 16px;
  margin: 0 0 28px;
  font-size: 13px;
}
.dm-figure-index__title { margin: 0 0 4px; font-weight: bold; color: var(--accent); }
.dm-figure-index ul { margin: 0; padding-left: 1.2em; }
.dm-figure-index a { color: var(--text); }

/* --- 表紙 ---------------------------------------------------------------- */

.dm-cover {
  max-width: 960px;
  margin: 0 auto 24px;
  padding: 80px 40px;
  background: var(--background);
  border: 1px solid var(--border);
  border-radius: 4px;
  text-align: center;
}
.dm-cover__kind { color: var(--muted); margin: 0 0 12px; letter-spacing: 0.2em; }
.dm-cover__title { font-size: 30px; color: var(--accent); margin: 0 0 48px; line-height: 1.5; }
.dm-cover__meta { margin: 0 auto; width: auto; border-collapse: collapse; font-size: 14px; }
.dm-cover__meta th, .dm-cover__meta td { border: 1px solid var(--border); padding: 6px 16px; text-align: left; }
.dm-cover__meta th { background: var(--surface); color: var(--muted); white-space: nowrap; }

/* --- 透かし -------------------------------------------------------------- */

.dm-watermark {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 10;
  padding: 4px 20px;
  border: 3px solid var(--danger);
  border-radius: 4px;
  color: var(--danger);
  font-size: 20px;
  font-weight: bold;
  letter-spacing: 0.25em;
  opacity: 0.55;
  transform: rotate(-8deg);
  pointer-events: none;
}

/* --- Mermaid の図 ------------------------------------------------------- */

/* 描画前は図の定義がそのまま見えるため、コードブロックとして表示しておく。
   mermaid.js が描画に成功すると <svg> に置き換わる。 */
pre.mermaid {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 12px 14px;
  overflow-x: auto;
  font-family: var(--mono);
  font-size: 13px;
}
pre.mermaid[data-processed="true"] {
  background: none;
  border: 0;
  padding: 0;
  text-align: center;
}
pre.mermaid svg { max-width: 100%; height: auto; }

/* --- 索引 ---------------------------------------------------------------- */

.dm-index__path { color: var(--muted); font-family: var(--mono); font-size: 12px; }
.dm-index__date { white-space: nowrap; font-variant-numeric: tabular-nums; }
/* 入力のディレクトリごとの見出し。トピックの枠見出しと同じ濃い帯にして、
   モノクロ印刷でも行の段が残るようにする。 */
.dm-index__group th {
  background: var(--accent);
  color: var(--accent-text);
  font-family: var(--mono);
  font-size: 12px;
  font-weight: normal;
}


/* corporate テーマ固有の上書き。色は CSS 変数（profiles.yaml の themes）で与える。 */


/* 印刷 (PDF 保存) 用。記録として PDF 化する運用を前提にする。 */

@media print {
  @page {
    size: A4;
    margin: 14mm 12mm;

    /* ページ番号。記録として保管するときに参照しやすいように入れる。
       CSS のマージンボックスに対応したブラウザ（Chrome / Edge）でのみ出る。
       対応していないブラウザでは、印刷ダイアログの「ヘッダーとフッター」を
       有効にすると、ブラウザ自身がページ番号を付ける。 */
    @bottom-center {
      content: counter(page) " / " counter(pages);
      font-family: var(--font);
      font-size: 9pt;
      color: #666;
    }
  }

  .dm-body { padding: 0; background: #fff; font-size: 11pt; line-height: 1.7; }
  .dm-page { max-width: none; margin: 0; padding: 0; border: 0; border-radius: 0; }

  /* 画面用の注記とコピーボタンは紙に出さない。 */
  .dm-note--screen, .dm-code__copy { display: none; }

  a { color: inherit; text-decoration: none; }
  /* 目次と相互参照のリンク先は紙では追えないため、URL は展開しない。 */

  .dm-section, .dm-step, .dm-summary__card, .dm-callout, .dm-figure, .dm-timeline__item,
  .dm-group, .dm-column, .dm-entry {
    break-inside: avoid;
    page-break-inside: avoid;
  }
  h1, h2, h3, h4 { break-after: avoid; page-break-after: avoid; }
  table { break-inside: auto; }
  tr, th, td { break-inside: avoid; page-break-inside: avoid; }

  /* プロファイルの print 設定で付くクラス。 */
  .dm-print-break-h1 .dm-content h1 { break-before: page; page-break-before: always; }
  .dm-print-break-h2 .dm-content h2 { break-before: page; page-break-before: always; }
  .dm-print-break-h1 .dm-content > .dm-section:first-child h1,
  .dm-print-break-h2 .dm-content > .dm-section:first-child h2 {
    break-before: auto;
    page-break-before: auto;
  }

  /* 表紙は必ず 1 ページ目に単独で出す。 */
  .dm-cover { padding: 60mm 0 0; border: 0; break-after: page; page-break-after: always; }

  /* 透かしは全ページに出したいので、固定配置のまま大きく中央に置く。 */
  .dm-watermark {
    top: 50%;
    left: 50%;
    right: auto;
    bottom: auto;
    transform: translate(-50%, -50%) rotate(-30deg);
    font-size: 72pt;
    opacity: 0.12;
    border-width: 8px;
  }

  .dm-content--dashboard { display: block; }
  .dm-content--dashboard > .dm-section { margin-bottom: 12px; }
}
