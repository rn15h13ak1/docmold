# docmold 同梱の既定プロファイル定義。
#
# このファイルは常に読み込まれ、ユーザ設定 config.yaml がその上に再帰マージされる。
# 直接編集せず、config.example.yaml をコピーした config.yaml に差分を書くこと
# （ツール更新で上書きされるため）。
#
# profiles.<type> のキー:
#   template     templates/ 直下の HTML ファイル名（構造）
#   theme        themes.<name>（見た目 = CSS 変数）
#   toc          false / true / {depth: 1-6, numbering: bool}
#   rules        意味づけの後処理。--list-rules で一覧
#   extensions   基本拡張に追加する Markdown 拡張
#   meta_header  冒頭のメタ表に出す front matter のキーと順序
#   print        {page_break_per_h1, page_break_per_h2, cover_page}
#   watermark    透かし文字列（例: DRAFT）。false / 省略で無効
#   mermaid      true で mermaid.min.js を埋め込む（assets/ に同梱が必要）
#   description  --list-types に出す説明

# 本文に直接書かれた HTML の扱い（全プロファイルの既定）。
#   strict … 許可リストに無い要素・属性を落とす（script / onerror / javascript: など）
#   false  … 素通しにする（Markdown 本来の挙動）
# 種類ごとに profiles.<type>.sanitize で上書きできる。
sanitize: strict

themes:
  corporate:
    accent: "#00529b"
    accent_weak: "#e8f0f8"
    accent_text: "#ffffff"
    font: "'Meiryo', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif"
    mono: "'Consolas', 'Menlo', 'MS Gothic', monospace"
    text: "#1f2328"
    muted: "#5a6472"
    border: "#d5dbe2"
    background: "#ffffff"
    surface: "#f7f9fb"
    ok: "#1e7e45"
    warn: "#b8860b"
    danger: "#c0392b"
    info: "#1b5fa8"

  alert:
    accent: "#c0392b"
    accent_weak: "#fdecea"
    accent_text: "#ffffff"
    font: "'Meiryo', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif"
    mono: "'Consolas', 'Menlo', 'MS Gothic', monospace"
    text: "#1f2328"
    muted: "#5a6472"
    border: "#e3cdc9"
    background: "#ffffff"
    surface: "#fdf6f5"
    ok: "#1e7e45"
    warn: "#b8860b"
    danger: "#c0392b"
    info: "#1b5fa8"

profiles:
  default:
    description: 汎用（type 未指定時）
    template: article.html
    theme: corporate
    toc: false

  minutes:
    description: 議事録
    template: article.html
    theme: corporate
    toc: true
    rules: [attendee_table, todo_checklist, decision_highlight]
    meta_header: [日時, 場所, 出席者, 次回]

  procedure:
    description: 作業手順書
    template: stepped.html
    theme: corporate
    toc: true
    rules: [step_numbering, command_block_copy, rollback_callout]
    meta_header: [対象システム, 実施日, 実施者, 所要時間]
    print:
      page_break_per_h2: true

  incident:
    description: 障害報告
    template: report.html
    theme: alert
    toc: true
    rules: [severity_badge, impact_summary, timeline_table]
    meta_header: [発生日時, 復旧日時, 影響範囲, 重要度]
    watermark: DRAFT

  spec:
    description: 設計書
    template: document.html
    theme: corporate
    toc:
      depth: 3
      numbering: true
    rules: [figure_caption, table_caption, cross_reference]
    meta_header: [版数, 作成日, 作成者, 承認者]
    # 図を CDN から読み込む。この種類の HTML だけは外部参照を持つ。
    # 閉域環境で開くなら mermaid: true（同梱を埋め込む）か false に変える。
    mermaid: cdn
    print:
      cover_page: true
      page_break_per_h1: true

  wiki:
    description: 知識ベースのノート
    template: article.html
    theme: corporate
    # 見出しに「1. 概要」のように章番号を書くノートが多いため、採番しない
    # （付けると「1.1 1. 概要」と二重になる）。
    toc:
      depth: 3
      numbering: false
    rules: [callout_blockquote]
    meta_header: [tags, updated]
    # 図を CDN から読み込む。1 ファイルずつ開いて読む用途のため、同梱を埋め込むと
    # 出力全体が数百 MB になる。閉域で配るなら mermaid: true か false に変える。
    mermaid: cdn

  weekly:
    description: 週次報告
    template: dashboard.html
    theme: corporate
    toc: false
    rules: [period_range, list_table, status_badge, progress_bar]
    meta_header: [期間, 報告者, チーム]

  weekly3:
    description: 週次の 3 列（前週・今週・来週）
    template: columns.html
    theme: corporate
    toc: false
    # group_columns を外すと、節がそのまま列になる（小見出しでまとめ直さない）。
    # topic_cards は group_columns が 1 列として残した節に効くため、後ろに置く。
    # column_periods は見出しの文字列を使うため、group_columns より前に置く。
    rules: [period_range, column_periods, list_table, count_summary, entry_card,
            status_badge, progress_bar, callout_blockquote, group_columns,
            topic_cards, topic_index]
    meta_header: [期間, 報告者]
    # ファイルサーバ上の資料へリンクできるようにする。閉域で配る前提の種類のみ。
    allow_schemes: [file]
