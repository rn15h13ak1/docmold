# docmold ユーザ設定のテンプレート。
#
#   copy config.example.yaml config.yaml     （Windows）
#   cp   config.example.yaml config.yaml     （macOS / Linux）
#
# 同梱の profiles.yaml に再帰マージされるため、変えたいところだけ書けばよい。
# 探索順: CWD/config.yaml → docmold.py と同じディレクトリ/config.yaml
# --config で明示指定もできる。

# --- 既存プロファイルの一部だけ変える ---------------------------------------
# profiles:
#   incident:
#     watermark: false          # 確定版なので透かしを消す
#   spec:
#     toc:
#       depth: 4

# --- テーマの色を自社色に差し替える -----------------------------------------
# themes:
#   corporate:
#     accent: "#006c4b"
#     accent_weak: "#e6f2ee"

# --- 種類を追加する ----------------------------------------------------------
# 追加は「YAML 数行 + （必要なら）ルール関数 1 つ」で済む。
# 独自ルールを足す場合は rules/ に関数を書き、@rule("名前") で登録する。
#
# themes:
#   review:
#     accent: "#7048a8"
#     accent_weak: "#f0ebf8"
#     accent_text: "#ffffff"
#     font: "'Meiryo', sans-serif"
#     mono: "'Consolas', monospace"
#     text: "#1f2328"
#     muted: "#5a6472"
#     border: "#ded5ea"
#     background: "#ffffff"
#     surface: "#faf8fd"
#     ok: "#1e7e45"
#     warn: "#b8860b"
#     danger: "#c0392b"
#
# profiles:
#   review:
#     description: レビュー記録
#     template: article.html
#     theme: review
#     toc: true
#     rules: [todo_checklist, status_badge]
#     meta_header: [対象, レビュー日, 参加者]

# --- 図（Mermaid）を有効にする ----------------------------------------------
# profiles:
#   spec:
#     mermaid: cdn        # CDN から読み込む（HTML は軽いが閲覧時に接続が要る）
#     # mermaid: true     # assets/mermaid.min.js を埋め込む（+約 3.4 MB / ファイル）
#     # mermaid:
#     #   url: "https://intra.example.com/lib/mermaid.min.js"
#     #   integrity: "sha384-..."

# --- ルールの検出語を調整する ------------------------------------------------
# ルールが本文を見分ける語。表記ゆれに合わせたいときに書く。
# グループ単位で「置き換え」になるため、足したい場合も既定値ごと書くこと。
# 書かなかったグループは既定のまま。
#
# keywords:
#   attendee: [出席者, 参加者, 参加メンバー, attendee, participants]
#   decision: [決定事項, 決定, 合意事項, decision]
#   progress_column: [進捗, 進捗率, 達成率, progress, 完了率]
#   rollback: [切戻し, 切り戻し, ロールバック, rollback, 復旧手順, リカバリ]
#   severity: [重要度, 深刻度, severity, レベル, 影響度]
#   status_column: [状態, ステータス, status, 進行, 対応状況]
#   status_danger: [未着手, 未対応, 失敗, 停止, 異常, ng, blocked, todo, open, 高, 重大, critical, 緊急]
#   status_ok: [完了, 済, 対応済, クローズ, done, closed, ok, 正常, 成功, 解決済]
#   status_warn: [進行中, 対応中, 作業中, 保留, 確認中, wip, in progress, doing, 遅延, 注意, warn, warning, 中]
#   step: [手順, step]
#   time_column: [時刻, 日時, 時間, time, タイムスタンプ]
#   timeline: [時系列, 経過, タイムライン, timeline, 対応経過]
#   todo: [todo, to do, アクション, 宿題, 持ち帰り, action item]

# 例: 「進捗状況」という列名も状態列として扱う
# keywords:
#   status_column: [状態, ステータス, status, 進行, 対応状況, 進捗状況]

# 例: 自社の言い回しを完了扱いにする
# keywords:
#   status_ok: [完了, 済, 対応済, クローズ, done, closed, ok, 正常, 成功, 解決済, 検収済]
